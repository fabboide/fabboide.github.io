# Pubblica quello che Claude ha preparato su Google Drive.
#
# Claude scrive nella cartella Drive "Talk with Fabio · Lezioni / Uscita
# sito" (esercizi nuovi, attivita per l'aula, piani delle lezioni) e
# questo workflow li porta nella repo. Spiegazione completa in cima a
# scripts/pubblica-da-drive.mjs.
#
# Parte da solo ogni mezz'ora, ai minuti 7 e 37 (fuori dalla calca del
# minuto 0), oppure a mano col bottone "Run workflow".

name: Pubblica da Drive

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: pubblica-da-drive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prendi i file da Drive
        env:
          GCAL_SA_KEY: ${{ secrets.GCAL_SA_KEY }}
        run: node scripts/pubblica-da-drive.mjs

      - name: Verifica i piani
        run: |
          node -e "const vm=require('vm');const s={};vm.runInNewContext(require('fs').readFileSync('lezioni/piano.js','utf8'),s);if(typeof s.PIANO!=='object')throw new Error('PIANO non e un oggetto');console.log(Object.keys(s.PIANO).length+' piani');"
          if grep -q "@" lezioni/piano.js; then
            echo "C'e una chiocciola in piano.js: il file e pubblico, mi fermo." >&2
            exit 1
          fi

      # Il conteggio dei saldi fa push sulla stessa repo: se e passato
      # nel frattempo, ci si rimette in coda dietro il suo commit.
      - name: Pubblica se e cambiato
        run: |
          git add -A aula-pfr2u9 esercizi lezioni/piano.js scripts/uscita-fatti.json
          if git diff --cached --quiet; then
            echo "Niente di nuovo da Drive."
            exit 0
          fi
          git config user.name "pubblica da drive"
          git config user.email "boccuzzifabio@gmail.com"
          git commit -m "Materiali e piani delle lezioni da Drive"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
