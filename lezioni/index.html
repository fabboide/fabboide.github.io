<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your lessons — Talk with Fabio</title>
<meta name="description" content="Your lesson balance and your booking calendar, in one page.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="https://talkwithfabio.com/favicon.svg" type="image/svg+xml">
<link rel="icon" href="https://talkwithfabio.com/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="https://talkwithfabio.com/apple-touch-icon.png">
<meta name="theme-color" content="#F7F4EC">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Caveat:wght@600;700&display=swap">

<style>
:root{
  --ink:#16233F; --ink-soft:#4A5670; --paper:#F7F4EC; --paper-2:#FFFDF8; --rule:#DFD8C7;
  --saffron:#E8A33D; --rosso:#C4312B; --verde:#2E5E4E;
  --display:"Bricolage Grotesque", system-ui, sans-serif;
  --text:"Newsreader", Georgia, serif;
  --pen:"Caveat", cursive;
  --mono:ui-monospace, SFMono-Regular, Menlo, monospace;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--text); font-size:1.06rem; line-height:1.6;
}
a{color:inherit;}
.wrap{max-width:900px; margin:0 auto; padding:0 22px;}

.nav{border-bottom:1px solid var(--rule); background:var(--paper-2);}
.nav .wrap{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 22px;}
.logo{
  display:flex; align-items:center; gap:10px; text-decoration:none;
  font-family:var(--display); font-weight:700; font-size:1.05rem;
}
.logo-mark{
  width:26px; height:26px; border-radius:50%; flex:none;
  background:conic-gradient(from 180deg, var(--verde) 0 25%, var(--saffron) 0 50%, var(--rosso) 0 75%, var(--ink) 0);
}
.back{font-family:var(--display); font-weight:500; font-size:0.94rem; text-decoration:none; color:var(--ink-soft);}
.back:hover{color:var(--rosso);}

main{padding:40px 0 70px;}
.eyebrow{
  font-family:var(--mono); font-size:0.72rem; letter-spacing:0.16em;
  text-transform:uppercase; color:var(--ink-soft); margin:0 0 10px;
}
h1{
  font-family:var(--display); font-weight:800; letter-spacing:-0.02em;
  font-size:clamp(1.8rem, 5.2vw, 2.6rem); line-height:1.08; margin:0 0 20px;
}
h1 .hl{color:var(--rosso);}

.card{
  background:var(--paper-2); border:1px solid var(--rule); border-radius:22px;
  padding:26px 26px 22px; box-shadow:0 14px 30px color-mix(in srgb, var(--ink) 6%, transparent);
}
.balance{display:flex; align-items:center; gap:26px; flex-wrap:wrap;}
.balance .n{
  font-family:var(--display); font-weight:800; font-size:clamp(3rem, 12vw, 4.2rem);
  line-height:1; letter-spacing:-0.04em;
}
.balance .side{flex:1 1 220px;}
.of{font-family:var(--display); font-weight:500; color:var(--ink-soft); font-size:1rem; margin:0 0 10px;}
.dots{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 6px;}
.dot{width:16px; height:16px; border-radius:50%; flex:none; background:var(--rule);}
.dot.left{background:var(--verde);}
.dot.booked{background:var(--saffron);}
.legend{
  font-family:var(--mono); font-size:0.68rem; letter-spacing:0.1em;
  text-transform:uppercase; color:var(--ink-soft); margin:0;
}

.booknote{
  margin:26px 0 12px; font-family:var(--display); font-weight:700; font-size:1.06rem;
}
.calendar-slot{
  background:var(--paper-2); border:1px solid var(--rule); border-radius:22px;
  padding:10px; min-height:520px; overflow:hidden;
}
.calendar-fallback{padding:40px 24px; text-align:center; color:var(--ink-soft);}

.lista-prenotate{
  margin:10px 0 0; padding:0; list-style:none;
}
.lista-prenotate li{
  display:grid; grid-template-columns:9px 1fr; gap:0 10px; padding:7px 0;
  font-family:var(--display); font-weight:500; font-size:1rem;
}
.lista-prenotate li::before{
  content:""; width:9px; height:9px; border-radius:50%; background:var(--saffron);
  flex:none; margin-top:0.42em;
}
.lista-prenotate .riga{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
.lista-prenotate .quando{font-family:var(--text); color:var(--ink-soft); font-size:0.95rem;}
.lista-prenotate .gestisci{
  grid-column:2; justify-self:start; margin-top:3px;
  font-family:var(--text); font-weight:400; font-size:0.85rem;
  color:var(--ink-soft); text-decoration:none;
  border-bottom:1px solid rgba(0,0,0,0.22);
}
.lista-prenotate .gestisci:hover{color:var(--rosso); border-bottom-color:currentColor;}
.prenotate-aiuto{
  margin:12px 0 0; font-family:var(--text); font-size:0.88rem; color:var(--ink-soft);
}
.prenotate-aiuto a{font-family:var(--display); font-weight:700; color:var(--rosso); text-decoration:none;}
.prenotate-aiuto a:hover{text-decoration:underline;}
.prenotate-titolo{
  font-family:var(--display); font-weight:700; font-size:1.06rem;
  margin:30px 0 0;
}
.btn{
  display:inline-block; padding:0.85em 1.5em; border-radius:999px;
  background:var(--ink); color:var(--paper-2); text-decoration:none;
  font-family:var(--display); font-weight:700; font-size:1rem;
}
.btn:hover{background:var(--rosso);}
.note{margin:18px 0 0; color:var(--ink-soft); font-size:0.98rem;}
.note a{font-family:var(--display); font-weight:700; color:var(--rosso); text-decoration:none;}
.note a:hover{text-decoration:underline;}
.pen{font-family:var(--pen); font-size:1.5rem; color:var(--verde); margin:26px 0 0;}
.stamp{
  margin:16px 0 0; font-family:var(--mono); font-size:0.68rem; letter-spacing:0.08em;
  text-transform:uppercase; color:var(--ink-soft);
}

form.codebox{display:flex; gap:10px; flex-wrap:wrap; margin-top:20px;}
input[type=text]{
  flex:1 1 220px; padding:0.8em 1em; border-radius:14px; border:1.5px solid var(--rule);
  background:var(--paper); font-family:var(--mono); font-size:1rem; letter-spacing:0.08em;
  color:var(--ink);
}
input[type=text]:focus{outline:none; border-color:var(--ink);}
.err{color:var(--rosso); font-family:var(--display); font-weight:500; margin:14px 0 0;}
@media (max-width:640px){ .calendar-slot{padding:4px; border-radius:16px;} }
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a class="logo" href="../"><span class="logo-mark" aria-hidden="true"></span>Talk with Fabio</a>
    <a class="back" href="../">&larr; The site</a>
  </div>
</header>

<main class="wrap">
  <p class="eyebrow">Your lessons</p>
  <div id="view"></div>
</main>

<script>
  /* Il calendario normale, quello che vale per tutti.
     Formato: "nomeutente/nome-evento", senza https://cal.com/ davanti. */
  var CAL_LINK = "italianwithfabio/lezione-di-italiano";

  /* La mail a cui scrive chi preferisce farsi cambiare la lezione da te. */
  var MAIL_FABIO = "boccuzzifabio@gmail.com";

  /* Conteggio automatico: indirizzo dello script che legge il calendario
     (quello che finisce con /exec). Se è vuoto, la pagina usa i numeri
     scritti a mano in saldi.js. */
  var CONTEGGIO_URL = "";
</script>
<script>
function avviaPagina() {
  "use strict";

  var view = document.getElementById("view");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function codeFromUrl() {
    var m = /[?&]c=([^&#]+)/.exec(window.location.search);
    return m ? decodeURIComponent(m[1]).trim().toLowerCase() : "";
  }

  function find(code) {
    if (!code || typeof SALDI !== "object") return null;
    var keys = Object.keys(SALDI);
    for (var i = 0; i < keys.length; i++) {
      if (keys[i].toLowerCase() === code) return SALDI[keys[i]];
    }
    return null;
  }

  /* Accetta sia "nomeutente/evento" sia un indirizzo intero copiato da Cal.com. */
  function toCalLink(raw) {
    if (!raw) return CAL_LINK;
    return String(raw).replace(/^https?:\/\/(app\.)?cal\.com\//i, "").replace(/^\/+|\/+$/g, "");
  }

  function dots(total, left, booked) {
    var out = "", classe;
    for (var i = 0; i < total; i++) {
      classe = i < left ? "left" : (i < left + booked ? "booked" : "");
      out += '<span class="dot ' + classe + '"></span>';
    }
    var legenda = left + " left";
    if (booked) legenda += " &middot; " + booked + (booked === 1 ? " booked" : " booked");
    legenda += " &middot; " + Math.max(0, total - left - booked) + " done";
    return '<div class="dots" role="img" aria-label="' + left + " of " + total + ' lessons left">' + out + "</div>" +
           '<p class="legend">' + legenda + "</p>";
  }

  function stampHtml(quando) {
    var when = quando || ((typeof SALDI_AGGIORNATO === "string" && SALDI_AGGIORNATO) ? SALDI_AGGIORNATO : "");
    return when ? '<p class="stamp">Count updated: ' + esc(when) + "</p>" : "";
  }

  /* Le lezioni già prenotate, scritte nel fuso orario di chi guarda la
     pagina: nel file sono istanti precisi, la conversione la fa il browser. */
  /* Il link per spostare o disdire arriva dalla descrizione di un evento
     del calendario, quindi prima di infilarlo in un href controlliamo che
     sia davvero un indirizzo di Cal.com e niente altro. */
  function linkSicuro(u) {
    return /^https:\/\/(app\.)?cal\.com\/[^\s"'<>]+$/i.test(String(u || "")) ? String(u) : "";
  }

  function prenotateHtml(date) {
    if (!date || !date.length) return "";

    var adesso = Date.now();
    var buone = [];
    for (var i = 0; i < date.length; i++) {
      /* Una lezione e un oggetto { quando, gestisci }. Le vecchie righe
         erano solo la data: continuano a funzionare, senza link. */
      var voce = date[i];
      var quando = (voce && typeof voce === "object") ? voce.quando : voce;
      var gestisci = (voce && typeof voce === "object") ? voce.gestisci : "";
      var t = new Date(quando);
      if (!isNaN(t.getTime()) && t.getTime() > adesso) {
        buone.push({ t: t, link: linkSicuro(gestisci) });
      }
    }
    if (!buone.length) return "";
    buone.sort(function (a, b) { return a.t - b.t; });

    var fmt;
    try {
      fmt = new Intl.DateTimeFormat(undefined, {
        weekday: "long", day: "numeric", month: "long",
        hour: "2-digit", minute: "2-digit"
      });
    } catch (err) { fmt = null; }

    var righe = buone.map(function (v) {
      var testo = fmt ? fmt.format(v.t) : v.t.toString();
      var pezzi = testo.split(/,\s*/);
      var giorno = pezzi.shift();
      return "<li>" +
        '<div class="riga"><strong>' + esc(giorno) + '</strong>' +
        '<span class="quando">' + esc(pezzi.join(", ")) + "</span></div>" +
        (v.link
          ? '<a class="gestisci" href="' + esc(v.link) + '" target="_blank" rel="noopener">' +
            "Reschedule or cancel</a>"
          : "") +
        "</li>";
    }).join("");

    var scrivimi = "mailto:" + MAIL_FABIO +
      "?subject=" + encodeURIComponent("Changing a lesson");

    /* Se nessuna lezione ha il link, inutile nominarlo. */
    var conLink = buone.some(function (v) { return !!v.link; });
    var aiuto = conLink
      ? 'Something came up? Move or cancel it yourself with the link, ' +
        'or <a href="' + scrivimi + '">write to me</a> and I\'ll sort it out.'
      : 'Need to change a lesson? <a href="' + scrivimi + '">Write to me</a> ' +
        'and I\'ll sort it out.';

    return '<p class="prenotate-titolo">Already booked</p>' +
      '<p class="legend" style="margin-top:4px;">shown in your local time</p>' +
      '<ul class="lista-prenotate">' + righe + "</ul>" +
      '<p class="prenotate-aiuto">' + aiuto + "</p>";
  }

  /* Il blocco dei numeri, rifatto da solo quando arriva il conteggio vero. */
  function saldoHtml(total, left, booked, quando) {
    return '<div class="balance">' +
        '<span class="n">' + left + "</span>" +
        '<div class="side">' +
          '<p class="of">of ' + total + " in your block</p>" +
          (total > 0 && total <= 40 ? dots(total, left, booked) : "") +
        "</div>" +
      "</div>" + stampHtml(quando);
  }

  function loadCalendar(calLink, name, mail) {
    (function (C, A, L) {
      var p = function (a, ar) { a.q.push(ar); };
      var d = C.document;
      C.Cal = C.Cal || function () {
        var cal = C.Cal, ar = arguments;
        if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; }
        if (ar[0] === L) {
          var api = function () { p(api, arguments); };
          var namespace = ar[1];
          api.q = api.q || [];
          if (typeof namespace === "string") { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]); }
          else p(cal, ar);
          return;
        }
        p(cal, ar);
      };
    })(window, "https://app.cal.com/embed/embed.js", "init");

    var config = {};
    if (name) config.name = name;
    if (mail) config.email = mail;

    Cal("init");
    Cal("inline", {
      elementOrSelector: "#my-cal-inline",
      calLink: calLink,
      layout: "month_view",
      config: config
    });
    Cal("ui", { hideEventTypeDetails: false, layout: "month_view", styles: { branding: { brandColor: "#16233F" } } });

    var slot = document.getElementById("my-cal-inline");
    var msg = document.getElementById("cal-fallback");
    if (!slot || !msg) return;
    var stop = setInterval(function () {
      if (slot.querySelector("iframe")) { msg.remove(); clearInterval(stop); }
    }, 400);
    setTimeout(function () { clearInterval(stop); }, 15000);
  }

  function askForCode(message) {
    view.innerHTML =
      '<h1>Where\'s your <span class="hl">link</span>?</h1>' +
      '<div class="card">' +
        "<p>This page opens with the personal link Fabio sent you when you bought your block of lessons. " +
        "Open that link again, or type your code here.</p>" +
        '<form class="codebox" id="f">' +
          '<input type="text" id="c" placeholder="your code" autocomplete="off" spellcheck="false" aria-label="Your code">' +
          '<button class="btn" type="submit">Open</button>' +
        "</form>" +
        (message ? '<p class="err">' + esc(message) + "</p>" : "") +
        '<p class="note">Lost it? Write to me at ' +
        '<a href="mailto:boccuzzifabio@gmail.com">boccuzzifabio@gmail.com</a> and I\'ll send it again. ' +
        'Booking a single lesson instead? <a href="../prenota/">Pick a time here</a>.</p>' +
      "</div>";
    document.getElementById("f").addEventListener("submit", function (e) {
      e.preventDefault();
      var v = document.getElementById("c").value.trim();
      if (v) window.location.search = "?c=" + encodeURIComponent(v.toLowerCase());
    });
  }

  function show(s, live) {
    var fonte = live || s;
    var total = Math.max(0, Number(fonte.pacchetto) || 0);
    var left = Math.max(0, Math.min(total, Number(fonte.rimaste)));
    var booked = Math.max(0, Math.min(total - left, Number(fonte.prenotate) || 0));
    var quando = live ? live.aggiornato : "";
    var name = s.nome ? esc(s.nome) : "";
    var over = left === 0;

    view.innerHTML =
      "<h1>" + (name ? "Ciao " + name + ", " : "") +
        (over ? 'your block is <span class="hl">finished</span>.'
              : 'you have <span class="hl">' + left + "</span> " + (left === 1 ? "lesson" : "lessons") + " left.") +
      "</h1>" +
      '<div class="card">' +
        '<div id="saldo">' + saldoHtml(total, left, booked, quando) + "</div>" +
        (s.nota ? '<p class="note">' + esc(s.nota) + "</p>" : "") +
      "</div>" +
      prenotateHtml(s.prossime) +
      (over
        ? '<p class="booknote">Want to keep going?</p>' +
          '<div class="card"><p>Tell me and I\'ll set up the next block, or pick one here.</p>' +
          '<p style="margin-top:18px;"><a class="btn" href="../#plans">See the blocks &rarr;</a></p></div>'
        : '<p class="booknote">Book your next lesson</p>' +
          '<div class="calendar-slot" id="my-cal-inline">' +
            '<div class="calendar-fallback" id="cal-fallback"><strong>The calendar is loading.</strong>' +
            "<p>If it doesn't appear, write to me and we'll find a time by email.</p></div>" +
          "</div>") +
      '<p class="pen">a presto!</p>';

    if (!over) loadCalendar(toCalLink(s.link), s.nome || "", s.mail || "");
  }

  /* Il conteggio vero arriva dallo script che legge il calendario.
     La risposta si carica come uno script, non come una chiamata dati:
     fra domini diversi è l'unico canale che il browser non blocca.
     Se non risponde entro pochi secondi restano i numeri scritti a mano:
     la pagina non deve mai restare vuota per colpa di un servizio lento. */
  function conteggioVero(code, s) {
    if (!CONTEGGIO_URL) return;

    var nome = "saldoPronto" + Math.floor(Math.random() * 1e9);
    var tag = document.createElement("script");
    var chiuso = false;

    function pulisci() {
      chiuso = true;
      try { delete window[nome]; } catch (err) { window[nome] = undefined; }
      if (tag && tag.parentNode) tag.parentNode.removeChild(tag);
    }

    window[nome] = function (d) {
      if (chiuso) return;
      pulisci();
      if (!d || d.errore) return;
      if (typeof d.rimaste !== "number" || typeof d.pacchetto !== "number") return;

      /* Se il pacchetto è finito cambia anche il resto della pagina,
         calendario compreso: si rifà tutto. */
      if (d.rimaste === 0) { show(s, d); return; }

      var box = document.getElementById("saldo");
      var titolo = document.querySelector("h1 .hl");
      if (box) box.innerHTML = saldoHtml(d.pacchetto, d.rimaste,
        Math.max(0, Math.min(d.pacchetto - d.rimaste, Number(d.prenotate) || 0)), d.aggiornato);
      if (titolo) titolo.textContent = String(d.rimaste);
    };

    setTimeout(function () { if (!chiuso) pulisci(); }, 8000);

    tag.src = CONTEGGIO_URL +
      "?c=" + encodeURIComponent(code) +
      "&callback=" + nome +
      "&t=" + Date.now();
    tag.onerror = pulisci;
    document.head.appendChild(tag);
  }

  var code = codeFromUrl();
  if (!code) { askForCode(""); return; }
  var found = find(code);
  if (!found) { askForCode("I don't have that one. Check it letter by letter, or write to me."); return; }
  show(found);
  conteggioVero(code, found);
}

/* I saldi si caricano con una marca temporale: cambiano spesso e non devono
   restare nella memoria del browser, se no lo studente vede un numero vecchio. */
(function () {
  var s = document.createElement("script");
  s.src = "saldi.js?t=" + Date.now();
  s.onload = avviaPagina;
  s.onerror = function () {
    document.getElementById("view").innerHTML =
      '<div class="card"><p>Something went wrong while loading your lessons. ' +
      'Reload the page, or write to me at ' +
      '<a href="mailto:boccuzzifabio@gmail.com">boccuzzifabio@gmail.com</a>.</p></div>';
  };
  document.head.appendChild(s);
})();
</script>

</body>
</html>
